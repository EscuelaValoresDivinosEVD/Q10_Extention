#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reconcile_q10_pending_reports:
    class: Q10::ReconcilePendingReportsJob
    queue: default
    schedule: at 3am every day
  cancel_stale_pending_payments:
    class: CancelStalePendingPaymentsJob
    queue: default
    schedule: at 4am every day
  # Recordatorios de cuota: 3 veces al día. Idempotente (no reenvía el mismo aviso).
  cuota_reminders_morning:
    class: CuotaRemindersJob
    queue: default
    schedule: at 8am every day
  cuota_reminders_afternoon:
    class: CuotaRemindersJob
    queue: default
    schedule: at 1pm every day
  cuota_reminders_evening:
    class: CuotaRemindersJob
    queue: default
    schedule: at 6pm every day

development:
  reconcile_q10_pending_reports:
    class: Q10::ReconcilePendingReportsJob
    queue: default
    schedule: at 3am every day
  cancel_stale_pending_payments:
    class: CancelStalePendingPaymentsJob
    queue: default
    schedule: at 4am every day
  cuota_reminders_morning:
    class: CuotaRemindersJob
    queue: default
    schedule: at 8am every day
  cuota_reminders_afternoon:
    class: CuotaRemindersJob
    queue: default
    schedule: at 1pm every day
  cuota_reminders_evening:
    class: CuotaRemindersJob
    queue: default
    schedule: at 6pm every day
